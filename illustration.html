<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustration - Chirantan Biswas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="short-films-page illustration-page">
    <div class="short-films-background" aria-hidden="true">
        <div class="short-films-bg illustration-bg--3"></div>
    </div>
    <main class="short-films-gallery illustration-gallery">
        <a class="short-films-back" href="index.html">&larr; BACK HOME</a>
        <h1>ILLUSTRATION</h1>
        <p class="illustration-label">DRAWINGS &amp; DIGITAL ART</p>
        <div class="illustration-carousel" aria-label="Illustration gallery">
            <button class="illustration-arrow illustration-arrow--left" type="button" aria-label="Previous image">
                <span aria-hidden="true">&#8249;</span>
            </button>
            <div class="illustration-showcase">
                <div class="illustration-track">
                    <img src="images/image_5.jpg" alt="Illustration artwork">
                    <img src="images/image_3.png" alt="Illustration artwork 2">
                    <img src="images/illustration_1.png" alt="Illustration artwork 3">
                    <img src="images/illustration_2.png" alt="Illustration artwork 4">
                    <img src="images/illustration_3.png" alt="Illustration artwork 5">
                    <img src="images/illustration_4.png" alt="Illustration artwork 6">
                    <img src="images/illustration_5.jpg" alt="Illustration artwork 7">
                </div>
            </div>
            <button class="illustration-arrow illustration-arrow--right" type="button" aria-label="Next image">
                <span aria-hidden="true">&#8250;</span>
            </button>
        </div>
    </main>
    <script src="illustration.js"></script>
</body>
</html>
